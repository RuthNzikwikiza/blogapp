{% extends 'blog/base.html' %}
{% block content %}
  {% for post in posts %}
    <div class="post">
      <h2 class="post-title">
        <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
      </h2>
      <p class="post-meta">By {{ post.author.username }} | {{ post.created_at|date:"M d, Y" }}</p>
      <p class="post-content">{{ post.content|truncatechars:150 }}</p>
    </div>
  {% endfor %}
{% endblock %}
